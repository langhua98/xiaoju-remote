<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Yunlai Yuki</title>
<!-- Yunlai Robot 的 3D 角色（Yuki）。说明见 ../README.md。yuki.js 是 src/main.js 的打包结果（npm run build）。 -->
<style>
  :root { --bg: #000; --ice: #7fe9ff; --ice-dim: rgba(127,233,255,.55); --ice-line: rgba(127,233,255,.22); }
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; background: var(--bg); }
  /* 背景：图片由 src/scene.js 按场景换（bg.jpg 夜景客厅、bg/ 里的卧室和哥特大厅），按图里地板的位置让角色站在地上。
     单独一层，镜头推近时可以跟着放大一点 */
  #bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000 center / cover no-repeat;
    transform-origin: 50% 40%; will-change: transform; }
  #stage { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity .8s ease; }
  #loading { position: fixed; top: 50%; left: 0; right: 0; text-align: center; color: var(--ice-dim);
    font: 13px -apple-system, "PingFang SC", sans-serif; }
  /* 采集摄像头、麦克风时，屏幕上方必须看得出来 */
  #sense { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 10px);
    display: flex; gap: 8px; pointer-events: none; font: 12px/1 -apple-system, "PingFang SC", sans-serif; color: var(--ice-dim); }
  .pill { display: none; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--ice-line); border-radius: 99px; background: rgba(0,0,0,.5); }
  .pill.on { display: flex; }
  .pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--ice); }
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="stage"></canvas>
<div id="loading">正在唤醒…</div>
<div id="sense">
  <div class="pill" id="pill-cam"><i></i>摄像头工作中</div>
  <div class="pill" id="pill-mic"><i></i>麦克风工作中</div>
</div>
<script src="yuki.js"></script>
</body>
</html>
