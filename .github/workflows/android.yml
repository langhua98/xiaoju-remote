name: Build 小橘遥控 apk

# android/（安卓被控端，2026-11 从 meta-work 搬过来）：在 GitHub 的 Ubuntu 机器上用 Android SDK 编译，
# 先编好 ncnn（NDK r23c，32 位 ARM），安装包才带 C++：模型测速、认出动的是什么（物体识别）。
# 编之前在电脑上用同一份 C++ 和模型认几张照片（tests/detector），再跑 Kotlin 单元测试，都过了才编安装包。
# 编好的 APK 每次都传到小橘云盘「软件包」（AGENTS.md 的约定）。
# 用 debug 签名的 APK（能直接装，不用签名工具）发布到 Release「xiaoju-remote-android」（每次覆盖）。
# 只留手动触发（Actions → Build 小橘遥控 apk → Run workflow），推送不自动编译，也不会触发 iPhone 的 ipa 编译。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xiaoju-remote-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 别装已经废弃的 tools 包（v3 默认会装，新 runner 上会报 Failed to find package 'tools'）
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;23.2.8568313"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: CMake 3.28.3 and Ninja
        # Gradle 里写死了 CMake 3.28.3（和本地一样），SDK 里没有这个版本，用 pip 装到 PATH 上；
        # numpy、Pillow 是电脑上测物体识别时转照片用的
        run: |
          python -m pip install cmake==3.28.3 ninja numpy Pillow
          cmake --version

      - name: Cache ncnn
        id: ncnn
        uses: actions/cache@v4
        with:
          path: ~/ncnn
          key: ncnn-20240820-${{ hashFiles('scripts/build-ncnn-android.sh', 'android/tests/detector/run.sh') }}

      - name: Build ncnn for Android (armeabi-v7a)
        if: steps.ncnn.outputs.cache-hit != 'true'
        # ANDROID_NDK 一定要指定：机器自带的 ANDROID_NDK 是最新的 NDK，跟 App 用的 r23c 链不到一起
        run: ANDROID_NDK=$ANDROID_HOME/ndk/23.2.8568313 PREFIX=$HOME/ncnn/armv7 WORK=$RUNNER_TEMP/ncnn sh scripts/build-ncnn-android.sh

      - name: Object detection test (desktop)
        # 电脑版 ncnn 也放在 ~/ncnn 里一起缓存；源码用上一步下好的（缓存命中时 run.sh 自己下）
        run: |
          mkdir -p ~/ncnn/desktop
          [ -d "$RUNNER_TEMP/ncnn/src" ] && export NCNN_SRC=$RUNNER_TEMP/ncnn/src
          WORK=$HOME/ncnn/desktop sh android/tests/detector/run.sh

      - name: Motion detection test (desktop)
        # C++ 超低功耗移动侦测：模拟场景算漏检率、误报率，查 analyze() 里不分配内存；顺便编一份电脑版 libxjmotion.so 给单元测试走 JNI
        run: WORK=$RUNNER_TEMP/motion sh android/tests/motion/run.sh $RUNNER_TEMP/motion/scenes.tsv

      - name: Unit tests
        working-directory: android
        env:
          XJ_NATIVE_LIB: ${{ runner.temp }}/motion/lib
          XJ_MOTION_TSV: ${{ runner.temp }}/motion/scenes.tsv
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon
          # C++ 版和 Kotlin 基准版在同一套模拟场景里的结果（漏检、误报），放进这次运行的摘要
          { echo "### 移动侦测：C++ 和 Kotlin 基准对比（模拟场景）"; echo; echo '```'; column -t -s "$(printf '\t')" "$XJ_MOTION_TSV"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Build debug APK
        working-directory: android
        env:
          # 云盘令牌编译时打进 App（BuildConfig.CLOUD_TOKEN），手机上不用填（William 的要求，0.20）
          XIAOJU_TOKEN: ${{ secrets.XIAOJU_TOKEN }}
        run: |
          if [ -z "$XIAOJU_TOKEN" ]; then
            echo "::error::没有 secret XIAOJU_TOKEN：法莉娅 0.20 起令牌要编进 App"
            exit 1
          fi
          chmod +x gradlew
          # 构建号写进 App（BuildConfig.BUILD_NUMBER），要和下面传到云盘的文件名里的 build<号> 一样，自动更新靠它比新旧
          NCNN_DIR=$HOME/ncnn/armv7 ./gradlew assembleDebug --no-daemon --stacktrace -PbuildNumber=${{ github.run_number }}
          # 一定要带上 C++（不然认不了东西）
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/armeabi-v7a/libxjbench.so'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/armeabi-v7a/libxjmotion.so'

      - name: Sign with the fixed key
        # 固定签名：密钥在小橘云盘私有文件夹 /小橘推送/签名/android-signing.json（PKCS12 + 密码），用 XIAOJU_TOKEN 取。
        # 以前每台 GitHub 机器都现生成一个 debug 密钥，每个新包签名都不一样，手机上不能覆盖安装。
        # 没有 XIAOJU_TOKEN 时照旧用临时签名，但这样的包装不上已经装了固定签名版的手机。
        working-directory: android
        env:
          XIAOJU_TOKEN: ${{ secrets.XIAOJU_TOKEN }}
        run: |
          if [ -z "$XIAOJU_TOKEN" ]; then
            echo "::warning::没有 secret XIAOJU_TOKEN，取不到固定签名：这个 APK 是临时签名，不能覆盖安装手机上的固定签名版"
            exit 0
          fi
          python3 - "$RUNNER_TEMP/xj.p12" "$RUNNER_TEMP/xj.pass" <<'PY'
          import base64, json, os, sys, urllib.parse, urllib.request
          base = "https://node.tail823dbd.ts.net/api/agent/v1"
          def get(path):
              req = urllib.request.Request(base + path, headers={"Authorization": "Bearer " + os.environ["XIAOJU_TOKEN"]})
              return urllib.request.urlopen(req, timeout=60).read()
          item = json.loads(get("/items?" + urllib.parse.urlencode({"path": "/小橘推送/签名/android-signing.json"})))
          item = item.get("item") or item
          d = json.loads(get("/items/%s/content" % item["id"]))
          print("::add-mask::" + d["password"])
          open(sys.argv[1], "wb").write(base64.b64decode(d["p12_base64"]))
          open(sys.argv[2], "w").write(d["password"])
          PY
          apk=app/build/outputs/apk/debug/app-debug.apk
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/xj.p12" --ks-type PKCS12 --ks-pass "file:$RUNNER_TEMP/xj.pass" \
            --ks-key-alias xiaoju --min-sdk-version 17 "$apk"
          "$bt/apksigner" verify --min-sdk-version 17 --print-certs "$apk" | grep -i 'SHA-256 digest' | head -1
          rm -f "$RUNNER_TEMP/xj.p12" "$RUNNER_TEMP/xj.pass"

      - name: Rename APK
        working-directory: android
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/xiaoju-remote-latest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: xiaoju-remote-apk
          path: android/out/xiaoju-remote-latest.apk

      - name: Publish to the xiaoju-remote-android release
        # 同时放一份规范名字的（xiaoju-remote-android-<版本>-build<构建号>.apk）：
        # 云盘（家里电脑）连不上时，手机改从这里查更新、下载（Updater 的 GitHub 兜底），看名字就能比新旧
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          named="android/out/xiaoju-remote-android-$ver-build${{ github.run_number }}.apk"
          cp android/out/xiaoju-remote-latest.apk "$named"
          gh release delete xiaoju-remote-android --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create xiaoju-remote-android \
            -R "$GITHUB_REPOSITORY" \
            --title "小橘遥控 APK" \
            --notes "被控端 APK。下载 xiaoju-remote-latest.apk 直接装（安卓设置里先允许「安装未知来源」）。带版本号的那个是给手机自动更新兜底用的，内容一样。" \
            android/out/xiaoju-remote-latest.apk "$named"

      - name: Upload to 小橘云盘 /软件包/
        # 每次编出新的 APK 都传到小橘云盘「软件包」（文件名带版本号和构建号），旧的 xiaoju-remote-android- 包删掉
        env:
          XIAOJU_TOKEN: ${{ secrets.XIAOJU_TOKEN }}
        run: |
          if [ -z "$XIAOJU_TOKEN" ]; then
            echo "::error::仓库没有 secret XIAOJU_TOKEN（有写权限的 xa_ 令牌），APK 没传到小橘云盘。到 Settings → Secrets and variables → Actions 里加上再重跑。"
            exit 1
          fi
          ver=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          apk="xiaoju-remote-android-$ver-build${{ github.run_number }}.apk"
          cp android/out/xiaoju-remote-latest.apk "$apk"
          python3 scripts/upload_package.py "$apk" xiaoju-remote-android-
          echo "云盘：/软件包/$apk" >> "$GITHUB_STEP_SUMMARY"
