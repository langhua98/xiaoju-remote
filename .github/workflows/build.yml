name: Build Vania ipa

# 本仓库：GitHub 的 Mac 机器上 xcodegen 生成工程再编译，
# 没签名的 .ipa 发布到 Release「latest」（每次覆盖），用 SideStore / 自己的证书签名后安装。
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "用哪种 Mac（macos-26 排不上时换 macos-15-intel）"
        default: macos-26
  push:
    paths:
      - "App/**"
      - "Robot/live2d/**"
      - "Tests/**"
      - "project.yml"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: DUML protocol self-test
        # 云台协议（App/Duml.swift）拿 Linggo 仓库 ble.html 在 OM6 上实测过的帧逐字节核对，对不上就不出包
        run: |
          swiftc App/Duml.swift Tests/main.swift -o "$RUNNER_TEMP/dumlcheck"
          "$RUNNER_TEMP/dumlcheck"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch Live2D assets
        # 机器人模式的脸：Live2D 运行库和 Hiyori 模型不放仓库，编译前下载（授权见 Robot/README.md）
        run: |
          sh Robot/live2d/fetch-assets.sh
          rm -rf Robot/live2d/node_modules

      - name: Build (unsigned)
        run: |
          xcodegen generate
          xcodebuild -project XiaojuRemote.xcodeproj -scheme XiaojuRemote -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
          app=build/Build/Products/Release-iphoneos/XiaojuRemote.app
          [ -d "$app" ] || { echo "::error::没编出 $app"; exit 1; }
          mkdir Payload && cp -R "$app" Payload/
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          ipa="Vania-$version-build$GITHUB_RUN_NUMBER.ipa"
          zip -qry "$GITHUB_WORKSPACE/$ipa" Payload
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "IPA=$ipa" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA }}
          path: ${{ env.IPA }}

      - name: Publish to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          cp "$IPA" Vania-latest.ipa
          gh release create latest "$IPA" Vania-latest.ipa --prerelease \
            --title "Vania ${VERSION}（构建 ${GITHUB_RUN_NUMBER}）" \
            --notes "没签名的测试版，需要用 SideStore 或自己的证书签名后安装。见仓库 README.md。"
